<title>Thali — Nutrition &amp; Training Tracker</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0B0B18; }
  * { box-sizing: border-box; }
  button, input, select, textarea { font: inherit; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
  input::placeholder, textarea::placeholder { color: rgba(200,195,230,0.35); }
  option { background: #1A1A2E; color: #E8E6FF; }
  @keyframes pulse-glow {
    0%,100% { box-shadow: 0 0 8px 2px rgba(255,107,53,0.35); }
    50%      { box-shadow: 0 0 18px 6px rgba(177,79,255,0.50); }
  }
  @keyframes slide-up {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .card-enter { animation: slide-up 0.25s ease both; }
</style>

function personalizedTargets(profile, caloTarget) {
  const wt = Number(profile.weight) || 70;
  const age = Number(profile.age) || 30;
  const sex = profile.sex || "male";
  const d = profile.diseases || [];
  const carbPct = d.includes("diabetes") ? 0.25 : 0.40;          // lower carbs for diabetes
  const protG   = d.includes("kidney")   ? 0.8 * wt : 1.6 * wt; // kidney disease: restrict protein
  return {
    protein:   Math.round(protG),
    carbs:     Math.round(caloTarget * carbPct / 4),
    fat:       Math.round(caloTarget * 0.30 / 9),
    fiber:     Math.max(20, Math.round(caloTarget / 1000 * 14)),
    iron:      sex === "male" ? 8 : (age >= 50 ? 8 : 18),
    calcium:   (age >= 71 || (sex === "female" && age >= 51)) ? 1200 : 1000,
    sodium:    d.includes("hypertension") ? 1500 : 2300,          // stricter for hypertension
    potassium: d.includes("kidney") ? 2000 : (sex === "male" ? 3400 : 2600),
  };
}

function parseHevyText(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const skip = (l) =>
    /@|hevy\.com|https?:\/\//i.test(l) ||
    /\d{1,2}:\d{2}\s*(am|pm)/i.test(l) ||
    /^(mon|tue|wed|thu|fri|sat|sun).*workout/i.test(l);
  const setRe = /^Set\s*\d+:\s*(?:([\d.]+)\s*kg\s*x\s*(\d+)|(\d+)\s*reps)/i;
  const exercises = [];
  let current = null;
  for (const line of lines) {
    if (skip(line)) continue;
    const m = line.match(setRe);
    if (m && current) {
      if (m[1] !== undefined) current.sets.push({ weight: parseFloat(m[1]), reps: parseInt(m[2]) });
      else current.sets.push({ weight: 0, reps: parseInt(m[3]) });
    } else if (!m) {
      current = { name: line, sets: [] };
      exercises.push(current);
    }
  }
  return exercises.filter((e) => e.sets.length);
}

function groupFor(name, db) {
  const hit = db.find((e) => e.name === name);
  return hit ? hit.group : "Other";
}

function bmr({ weight, height, age, sex }) {
  const w = Number(weight) || 0, h = Number(height) || 0, a = Number(age) || 0;
  const base = 10 * w + 6.25 * h - 5 * a;
  return sex === "male" ? base + 5 : base - 161;
}
const ACTIVITY = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725 };

function safeDeficitPlan(profile) {
  const b = bmr(profile);
  const tdee = b * ACTIVITY[profile.activity];
  const maxDeficit = Math.min(750, tdee * 0.25);
  const target = Math.round(tdee - maxDeficit);
  const floor = profile.sex === "male" ? 1500 : 1200;
  const safeTarget = Math.max(target, floor);
  const weeklyLossKg = ((tdee - safeTarget) * 7) / 7700;
  const toLose = (Number(profile.weight) || 0) - (Number(profile.goalWeight) || 0);
  const weeks = weeklyLossKg > 0 ? Math.ceil(toLose / weeklyLossKg) : null;
  return { bmr: Math.round(b), tdee: Math.round(tdee), target: safeTarget, weeklyLossKg, weeks };
}

function RadialProgress({ pct, size = 108, stroke = 11, color }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, offset = c - (Math.min(100, pct) / 100) * c;
  const grad = color || T.accent;
  return (
    <svg width={size} height={size} style={{ filter: `drop-shadow(0 0 8px ${typeof grad === "string" && grad.startsWith("#") ? grad : T.accent}55)` }}>
      <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#FF6B35" />
          <stop offset="100%" stopColor="#B14FFF" />
        </linearGradient>
      </defs>
      <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.07)" strokeWidth={stroke} fill="none" />
      <circle cx={size / 2} cy={size / 2} r={r} stroke={color || "url(#ringGrad)"} strokeWidth={stroke} fill="none"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform={`rotate(-90 ${size / 2} ${size / 2})`} />
    </svg>
  );
}
function WeightTrendChart({ data }) {
  const w = 320, h = 140, pad = 28;
  const vals = data.map((d) => d.w);
  const min = Math.min(...vals) - 0.5, max = Math.max(...vals) + 0.5;
  const x = (i) => pad + (i / (data.length - 1)) * (w - 2 * pad);
  const y = (v) => h - pad - ((v - min) / (max - min)) * (h - 2 * pad);
  const points = data.map((d, i) => `${x(i)},${y(d.w)}`).join(" ");
  const areaPoints = `${x(0)},${h - pad} ${points} ${x(data.length - 1)},${h - pad}`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="160">
      <defs>
        <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor="#FF6B35" />
          <stop offset="100%" stopColor="#B14FFF" />
        </linearGradient>
        <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor="#B14FFF" stopOpacity="0.30" />
          <stop offset="100%" stopColor="#B14FFF" stopOpacity="0.00" />
        </linearGradient>
      </defs>
      <polygon points={areaPoints} fill="url(#areaGrad)" />
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke="rgba(255,255,255,0.08)" />
      <polyline points={points} fill="none" stroke="url(#lineGrad)" strokeWidth="2.5" />
      {data.map((d, i) => (
        <circle key={i} cx={x(i)} cy={y(d.w)} r="4" fill="#0B0B18" stroke="#FF6B35" strokeWidth="2" />
      ))}
      {data.map((d, i) => i % 2 === 0 && (
        <text key={i} x={x(i)} y={h - 6} fontSize="9" fill={T.soft} textAnchor="middle">{d.d}</text>
      ))}
    </svg>
  );
}
function VolumeBarChart({ data }) {
  const w = 320, h = 140, pad = 24, gap = 8;
  const max = Math.max(...data.map((d) => d.volume), 1);
  const barW = (w - 2 * pad) / data.length - gap;
  const colors = ["#FF6B35","#B14FFF","#00D4A0","#FFD700","#FF4B6E","#00BFFF","#FF9800","#E040FB"];
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="160">
      <defs>
        {data.map((_, i) => (
          <linearGradient key={i} id={`vg${i}`} x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor={colors[i % colors.length]} stopOpacity="1" />
            <stop offset="100%" stopColor={colors[i % colors.length]} stopOpacity="0.40" />
          </linearGradient>
        ))}
      </defs>
      <line x1={pad} y1={h - pad} x2={w - pad} y2={h - pad} stroke="rgba(255,255,255,0.08)" />
      {data.map((d, i) => {
        const bh = Math.max(4, (d.volume / max) * (h - 2 * pad - 10));
        const x = pad + i * ((w - 2 * pad) / data.length) + gap / 2;
        return (
          <g key={d.group}>
            <rect x={x} y={h - pad - bh} width={barW} height={bh} fill={`url(#vg${i})`} rx="4" />
            <text x={x + barW / 2} y={h - 7} fontSize="8" fill={T.soft} textAnchor="middle">{d.group}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ---------- Workout tab ---------- */
function WorkoutTab({ workoutLog, addWorkout, removeWorkout, profile, exerciseDb, addExercise, dateLabel }) {
  const [hevyText, setHevyText] = useState("");
  const [parsed, setParsed] = useState(null);

  const [manualSets, setManualSets] = useState([{ weight: "", reps: "" }]);

  const [customExName, setCustomExName] = useState("");
  const [customExGroup, setCustomExGroup] = useState("Legs");

  const setVolume = workoutLog.reduce((sum, ex) => sum + ex.sets.reduce((s, st) => s + st.weight * st.reps, 0), 0);
  const totalSets = workoutLog.reduce((s, ex) => s + ex.sets.length, 0);
  const dailySetGoal = 20;
  const setGoalPct = Math.min(100, Math.round((totalSets / dailySetGoal) * 100));
  const durationHours = (totalSets * 3) / 60;
  const caloriesBurned = Math.round(5 * (profile?.weight || 80) * durationHours);

  const bodyGroups = ["All", ...Array.from(new Set(exerciseDb.map((e) => e.group)))];
  const filteredExercises = exerciseDb.filter(
    (e) => (groupFilter === "All" || e.group === groupFilter) && e.name.toLowerCase().includes(search.toLowerCase())
  );

  const byGroup = useMemo(() => {
    const m = {};
    workoutLog.forEach((ex) => {
      const g = groupFor(ex.name, exerciseDb);
      (m[g] = m[g] || []).push(ex);
    });
    return m;
  }, [workoutLog, exerciseDb]);

  const toggle = (i) => {
    const next = new Set(expanded);
    next.has(i) ? next.delete(i) : next.add(i);
    setExpanded(next);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Card>
        <Label>Workout — {dateLabel}</Label>
        {workoutLog.length === 0 ? (
          <div style={{ fontSize: 13, color: T.soft }}>Nothing logged for {dateLabel.toLowerCase() === "today" ? "today" : dateLabel} yet — paste from Hevy or add manually below.</div>

          <>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>

              <div key={group} style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 11, color: T.accent, fontWeight: 600, marginBottom: 4 }}>{group}</div>
                {exs.map((ex) => {
                  const isOpen = expanded.has(ex._idx);
                  const vol = ex.sets.reduce((s, st) => s + st.weight * st.reps, 0);
                  return (
                    <div key={ex._idx} style={{ borderTop: `1px solid ${T.border}` }}>
                      <div style={{ display: "flex", alignItems: "center" }}>
                        <button onClick={() => toggle(ex._idx)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flex: 1, background: "none", border: "none", padding: "8px 0", cursor: "pointer", textAlign: "left", fontFamily: T.sans }}>
                          <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: T.ink }}>

                      </div>
                      {isOpen && (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, paddingBottom: 8, paddingLeft: 20 }}>
                          {ex.sets.map((s, j) => (
                            <span key={j} style={{ fontSize: 11, background: "rgba(255,107,53,0.15)", color: T.accent, borderRadius: 20, padding: "3px 9px" }}>

                            </span>

      <Card style={{ background: T.goldSoft, border: `1px solid ${T.gold}33` }}>
        <Label>{dateLabel}'s workout impact</Label>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
          <span style={{ fontSize: 22 }}>🔥</span>

          </div>
        </div>
        <div style={{ fontSize: 12, color: T.soft, marginBottom: 4 }}>{totalSets} / {dailySetGoal} sets toward the training goal for this day</div>
        <div style={{ height: 8, background: "#FFFFFF", borderRadius: 4, overflow: "hidden" }}>
          <div style={{ width: `${setGoalPct}%`, height: "100%", background: T.gold }} />
        </div>
        <div style={{ fontSize: 11, color: T.soft, marginTop: 8 }}>

                <b>{ex.name}</b> <span style={{ color: T.soft }}>({groupFor(ex.name, exerciseDb)})</span> — {ex.sets.map((s) => (s.weight > 0 ? `${s.weight}×${s.reps}` : `${s.reps} reps`)).join(", ")}
              </div>
            ))}
            <button style={{ ...btnStyle, background: T.good }} onClick={() => { addWorkout(parsed); setParsed(null); setHevyText(""); }}>Confirm &amp; save</button>
          </div>
        )}
      </Card>

      <Card>
        <Label>No Hevy / InBody? Add a workout manually</Label>
        <input placeholder="Search exercises…" value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 8 }} />
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
          {bodyGroups.map((g) => (
            <button key={g} onClick={() => setGroupFilter(g)} style={{ fontSize: 11, padding: "4px 10px", borderRadius: 20, cursor: "pointer", border: `1px solid ${groupFilter === g ? T.accent : T.border}`, background: groupFilter === g ? T.accent : T.surface, color: groupFilter === g ? "#fff" : T.soft }}>{g}</button>
          ))}
        </div>
        <div style={{ maxHeight: 130, overflowY: "auto", border: `1px solid ${T.border}`, borderRadius: 8, marginBottom: 6 }}>
          {filteredExercises.length === 0 ? (
            <div style={{ fontSize: 12, color: T.soft, padding: 10 }}>No exercises match "{search}" — add it as a custom exercise below.</div>
          ) : (
            filteredExercises.map((e) => (
              <button key={e.name} onClick={() => setManualName(e.name)} style={{ display: "block", width: "100%", textAlign: "left", padding: "8px 10px", background: manualName === e.name ? "rgba(255,107,53,0.15)" : "transparent", border: "none", borderBottom: `1px solid ${T.border}`, cursor: "pointer", fontFamily: T.sans }}>
                <span style={{ fontSize: 13, color: T.ink }}>{e.name}</span> <span style={{ fontSize: 11, color: T.soft }}>· {e.group}</span>
              </button>
            ))

        </div>
        <button onClick={() => setShowCustomEx(!showCustomEx)} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", color: T.accent, fontSize: 12, cursor: "pointer", padding: "4px 0 10px" }}>
          + {showCustomEx ? "Cancel custom exercise" : "Can't find it? Add a custom exercise"}
        </button>
        {showCustomEx && (
          <div style={{ background: "rgba(255,255,255,0.04)", borderRadius: 10, padding: 10, marginBottom: 10, border: `1px solid ${T.border}` }}>
            <input placeholder="Exercise name" value={customExName} onChange={(e) => setCustomExName(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 6 }} />
            <select value={customExGroup} onChange={(e) => setCustomExGroup(e.target.value)} style={selectStyle}>

            <button style={btnStyle} onClick={() => { if (!customExName.trim()) return; addExercise({ name: customExName.trim(), group: customExGroup }); setManualName(customExName.trim()); setCustomExName(""); setShowCustomEx(false); }}>Add to exercise list</button>
          </div>
        )}
        <div style={{ fontSize: 12, color: T.soft, marginBottom: 6 }}>Selected: <span style={{ color: T.ink }}>{manualName}</span></div>
        {manualSets.map((s, i) => (
          <div key={i} style={{ display: "flex", gap: 8, marginTop: 6 }}>
            <input placeholder="kg" value={s.weight} onChange={(e) => { const next = [...manualSets]; next[i].weight = e.target.value; setManualSets(next); }} style={{ ...inputStyle, width: 60 }} />
            <input placeholder="reps" value={s.reps} onChange={(e) => { const next = [...manualSets]; next[i].reps = e.target.value; setManualSets(next); }} style={{ ...inputStyle, width: 60 }} />

        ))}
        <button style={{ ...btnStyle, background: T.soft }} onClick={() => setManualSets([...manualSets, { weight: "", reps: "" }])}>+ Add set</button>
        <button style={btnStyle} onClick={() => { addWorkout([{ name: manualName, sets: manualSets.filter((s) => s.reps).map((s) => ({ weight: parseFloat(s.weight) || 0, reps: parseInt(s.reps) })) }]); setManualSets([{ weight: "", reps: "" }]); }}>Save manual entry</button>
      </Card>
    </div>
  );
}

  const [geminiLoading, setGeminiLoading] = useState(false);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2500); };

  /* ── Gemini nutrition lookup ───────────────────────────────────────── */
  function doGeminiSearch(q) {
    if (!q.trim() || !geminiKey.trim()) return;
    setGeminiLoading(true); setGeminiError(""); setGeminiResults([]);
    const prompt = `You are a nutrition database. Return ONLY a raw JSON array — no markdown, no code fences, no explanation, nothing else.
For the food "${q.trim()}", output 1-3 entries covering common serving sizes.
Format exactly:
[{"name":"Food Name (serving)","unit":"1 pc","kcal":78,"p":6,"c":0.6,"f":5,"fiber":0,"iron":0.9,"calcium":25,"sodium":62,"potassium":63}]
Use standard Indian home-cooked values where applicable. All numbers must be plain numbers, not strings.`;

    fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiKey.trim()}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 1024 },
      }),
    })
      .then((r) => r.json())
      .then((data) => {
        // Check for API-level errors first
        if (data.error) {
          const code = data.error.status || "";
          const httpCode = data.error.code || 0;
          if (code === "INVALID_ARGUMENT" || code === "UNAUTHENTICATED" || httpCode === 400 || httpCode === 401) {
            throw new Error("Invalid API key. Get a fresh key from aistudio.google.com → API Keys.");
          }
          if (code === "UNAVAILABLE" || code === "RESOURCE_EXHAUSTED" || httpCode === 503 || httpCode === 429) {
            throw new Error("__busy__");
          }
          throw new Error(data.error.message || "Gemini API error");
        }
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
        const cleaned = raw.replace(/```json?\s*/gi, "").replace(/```/g, "").trim();
        let items;
        try {
          // Try direct parse first, then regex-extract the array
          const src = cleaned.startsWith("[") ? cleaned : (cleaned.match(/\[[\s\S]*\]/) || [""])[0];
          items = JSON.parse(src);
        } catch (_) {
          throw new Error(`Gemini returned incomplete JSON — response was cut off. (Preview: ${cleaned.slice(0, 60)})`);
        }
        if (!Array.isArray(items) || items.length === 0) throw new Error("Empty result — try rephrasing.");
        // Normalise fields
        const normalised = items.map((it) => ({
          name: String(it.name || q).slice(0, 60),
          unit: String(it.unit || "1 serving"),
          kcal: Number(it.kcal) || 0,
          p: Number(it.p) || 0,
          c: Number(it.c) || 0,
          f: Number(it.f) || 0,
          fiber: Number(it.fiber) || 0,
          iron: Number(it.iron) || 0,
          calcium: Number(it.calcium) || 0,
          sodium: Number(it.sodium) || 0,
          potassium: Number(it.potassium) || 0,
        }));
        setGeminiResults(normalised);
        setGeminiLoading(false);
      })
      .catch((err) => {
        setGeminiError(err.message || "Gemini error — try again.");
        setGeminiLoading(false);
      });
  }

  /* ── AI paste parser ───────────────────────────────────────────────── */
  function parseAIPaste(text) {
    const entries = [];
    let currentMeal = "Breakfast";
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      if (/^#+\s*breakfast|^\*?\*?breakfast\*?\*?:/i.test(line)) { currentMeal = "Breakfast"; continue; }
      if (/^#+\s*lunch|^\*?\*?lunch\*?\*?:/i.test(line))         { currentMeal = "Lunch"; continue; }
      if (/^#+\s*dinner|^\*?\*?dinner\*?\*?:/i.test(line))       { currentMeal = "Dinner"; continue; }
      if (/^#+\s*snack|^\*?\*?snack\*?\*?:/i.test(line))         { currentMeal = "Snack"; continue; }
      const kcalM = line.match(/(\d+(?:\.\d+)?)\s*(?:kcal|cal|calories)/i);
      if (!kcalM) continue;
      const kcal = parseFloat(kcalM[1]);
      const pM = line.match(/(?:protein|p)[\s:]*(\d+(?:\.\d+)?)\s*g/i);
      const cM = line.match(/(?:carb[a-z]*|c)[\s:]*(\d+(?:\.\d+)?)\s*g/i);
      const fM = line.match(/(?:fat|f)[\s:]*(\d+(?:\.\d+)?)\s*g/i);
      const p = pM ? parseFloat(pM[1]) : 0;
      const c = cM ? parseFloat(cM[1]) : 0;
      const f = fM ? parseFloat(fM[1]) : 0;
      let name = line.replace(/^[\-\*•|\s]+/, "").replace(/\*\*/g, "");
      const cut = Math.min(...[name.indexOf(":"), name.indexOf("|"), name.indexOf("(")].filter((x) => x > 0).concat([Infinity]));
      if (cut < Infinity) name = name.slice(0, cut);
      name = name.trim().slice(0, 50);
      if (!name || /^(total|summary|food|item|quantity|serving)/i.test(name)) continue;
      if (kcal === 0 && p === 0) continue;
      entries.push({ name, kcal, p, c, f, fiber: 0, iron: 0, calcium: 0, sodium: 0, potassium: 0, meal: currentMeal });
    }
    return entries;
  }

  /* ── Food search: fetch → JSONP fallback ──────────────────────────── */
  function doOnlineSearch(q) {
    if (!q.trim()) return;
    const query = q.trim();
    setOnlineLoading(true); setOnlineError(""); setOnlineResults([]); setSelectedOnlineItem(null);

    const processProducts = (products) => {
      const items = (products || [])
        .filter((p) => p.product_name && p.nutriments && (p.nutriments["energy-kcal_100g"] || 0) > 0)
        .slice(0, 12);
      setOnlineResults(items);
      if (items.length === 0) setOnlineError('No results — try a simpler word (e.g. "egg" not "white boiled egg").');
      setOnlineLoading(false);
    };

    // Primary: fetch v2 API (has CORS headers — works in Chrome from file://)
    const url = `https://world.openfoodfacts.org/api/v2/search?search_terms=${encodeURIComponent(query)}&fields=product_name,nutriments&page_size=20`;
    fetch(url)
      .then((r) => r.json())
      .then((data) => processProducts(data.products))
      .catch(() => {
        // Fallback: JSONP (works in some browsers where fetch is blocked)
        const cbName = `off_${Date.now()}`;
        const script = document.createElement("script");
        script.src = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&callback=${cbName}`;
        let done = false;
        const finish = (err) => {
          if (done) return; done = true;
          clearTimeout(timer);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          if (err) { setOnlineError(err); setOnlineLoading(false); }
        };
        const timer = setTimeout(() => finish('Timed out — try again, or switch to 🤖 AI Paste.'), 12000);
        window[cbName] = (data) => { processProducts(data.products); finish(null); };
        script.onerror = () => finish("__blocked__");
        document.head.appendChild(script);
      });
  }

  const food = foodDb.find((f) => f.name === foodPick) || foodDb[0];
  const filteredFoods = foodDb.filter((f) => f.name.toLowerCase().includes(search.toLowerCase()));

  const viewMeals = mealFilter === "All" ? meals : meals.filter((m) => m.meal === mealFilter);

  const totals = meals.reduce((a, m) => ({
    kcal: a.kcal + m.kcal, p: a.p + m.p, c: a.c + m.c, f: a.f + m.f,
    fiber: a.fiber + (m.fiber || 0), iron: a.iron + (m.iron || 0),
    calcium: a.calcium + (m.calcium || 0), sodium: a.sodium + (m.sodium || 0), potassium: a.potassium + (m.potassium || 0),
  }), { kcal: 0, p: 0, c: 0, f: 0, fiber: 0, iron: 0, calcium: 0, sodium: 0, potassium: 0 });

  const pct = Math.min(100, Math.round((totals.kcal / plan.target) * 100));
  const remaining = plan.target - totals.kcal;
  const pt = personalizedTargets(profile, plan.target);
  const macroTargets = { p: pt.protein, c: pt.carbs, f: pt.fat };

  const MEAL_TABS = ["All", "Breakfast", "Lunch", "Dinner", "Snack"];

  const macroConfig = [
    { key: "p", label: "Protein", color: T.good, grad: "linear-gradient(90deg,#00D4A0,#00BFFF)", unit: "g" },
    { key: "f", label: "Fats",    color: "#FFD700", grad: "linear-gradient(90deg,#FFD700,#FF9800)", unit: "g" },
    { key: "c", label: "Carbs",   color: T.accent,  grad: "linear-gradient(90deg,#FF6B35,#FF4B6E)", unit: "g" },
    { key: "fiber", label: "Fiber", color: T.accent2, grad: "linear-gradient(90deg,#B14FFF,#7B2FFF)", unit: "g",
      t: pt.fiber },
  ];

  // ── Contributors view ──────────────────────────────────────────────────
  if (insightView === "contributors") {
    const mc = macroConfig.find((m) => m.key === contributorMacro) || macroConfig[0];
    const sorted = [...meals].sort((a, b) => (b[mc.key] || 0) - (a[mc.key] || 0)).slice(0, 8);
    const totalMacro = totals[mc.key] || 0;
    const macroT = mc.t || macroTargets[mc.key] || 1;
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => setInsightView(null)} style={{ background: "none", border: "none", color: T.accent, fontSize: 22, cursor: "pointer", padding: 0 }}>←</button>
          <span style={{ color: T.ink, fontWeight: 700, fontSize: 17 }}>Top Contributors</span>
        </div>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
          {macroConfig.map((m) => (
            <button key={m.key} onClick={() => setContributorMacro(m.key)} style={{ flexShrink: 0, padding: "6px 14px", borderRadius: 99, border: "none", background: contributorMacro === m.key ? m.grad : "rgba(255,255,255,0.07)", color: contributorMacro === m.key ? "#fff" : T.soft, fontSize: 13, cursor: "pointer", fontWeight: contributorMacro === m.key ? 700 : 400 }}>{m.label}</button>
          ))}
        </div>
        <Card>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
            <div style={{ position: "relative", width: 72, height: 72 }}>
              <RadialProgress pct={Math.min(100, (totalMacro / macroT) * 100)} size={72} stroke={8} color={mc.grad} />
              <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: T.ink, fontWeight: 700 }}>{Math.round((totalMacro / macroT) * 100)}%</div>
            </div>
            <div>
              <div style={{ color: T.soft, fontSize: 12 }}>Total {mc.label}</div>
              <Num size={22}>{Math.round(totalMacro)}{mc.unit}</Num>
              <div style={{ color: T.soft, fontSize: 12 }}>of {macroT}{mc.unit} target</div>
            </div>
          </div>
          {sorted.length === 0 && <div style={{ color: T.soft, fontSize: 13 }}>No food logged yet.</div>}
          {sorted.map((m, i) => {
            const val = m[mc.key] || 0;
            const pctBar = totalMacro > 0 ? (val / totalMacro) * 100 : 0;
            return (
              <div key={i} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                  <span style={{ fontSize: 14, color: T.ink }}>{m.name}</span>
                  <span style={{ fontSize: 13, color: mc.color, fontWeight: 700 }}>{Math.round(val)}{mc.unit}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <MacroBar value={val} target={totalMacro} grad={mc.grad} />
                  <span style={{ fontSize: 11, color: T.soft, minWidth: 30, textAlign: "right" }}>{Math.round(pctBar)}%</span>
                </div>
              </div>
            );
          })}
        </Card>
      </div>
    );
  }

  // ── Micros/nutrients view ──────────────────────────────────────────────
  if (insightView === "micros") {
    const microRows = [
      { key: "fiber", label: "Fiber", t: pt.fiber, unit: "g", grad: "linear-gradient(90deg,#B14FFF,#7B2FFF)", isCap: false },
      { key: "iron", label: "Iron", t: pt.iron, unit: "mg", grad: "linear-gradient(90deg,#FF6B35,#FFD700)", isCap: false },
      { key: "calcium", label: "Calcium", t: pt.calcium, unit: "mg", grad: "linear-gradient(90deg,#00D4A0,#00BFFF)", isCap: false },
      { key: "sodium", label: "Sodium", t: pt.sodium, unit: "mg", grad: "linear-gradient(90deg,#FF4B6E,#FF6B35)", isCap: true },
      { key: "potassium", label: "Potassium", t: pt.potassium, unit: "mg", grad: "linear-gradient(90deg,#00BFFF,#B14FFF)", isCap: false },
    ];
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => setInsightView(null)} style={{ background: "none", border: "none", color: T.accent, fontSize: 22, cursor: "pointer", padding: 0 }}>←</button>
          <span style={{ color: T.ink, fontWeight: 700, fontSize: 17 }}>Micronutrients</span>
        </div>
        <Card>
          {microRows.map((row) => {
            const val = totals[row.key] || 0;
            const pctFill = Math.min(100, (val / row.t) * 100);
            const over = row.isCap && val > row.t;
            return (
              <div key={row.key} style={{ marginBottom: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ color: T.ink, fontSize: 14, fontWeight: 600 }}>{row.label}</span>
                  <span style={{ fontSize: 13, color: over ? T.alert : T.soft }}>{Math.round(val)} / {row.t} {row.unit} · <span style={{ color: over ? T.alert : T.good, fontWeight: 700 }}>{Math.round(pctFill)}%</span></span>
                </div>
                <MacroBar value={val} target={row.t} grad={over ? "linear-gradient(90deg,#FF4B6E,#FF0055)" : row.grad} />
                <div style={{ fontSize: 11, color: T.soft, marginTop: 4 }}>{row.isCap ? "Keep under" : "Target"}: {row.t} {row.unit}</div>
              </div>
            );
          })}
        </Card>
      </div>
    );
  }

  // ── Saved Meal Builder view ────────────────────────────────────────────
  if (buildingPlan) {
    const planFiltered = foodDb.filter((f) => f.name.toLowerCase().includes(planSearch.toLowerCase())).slice(0, 30);
    const planTotals = planItems.reduce((a, item) => {
      const fd = foodDb.find((f) => f.name === item.foodName);
      if (!fd) return a;
      return { kcal: a.kcal + fd.kcal * item.qty, p: a.p + fd.p * item.qty, c: a.c + fd.c * item.qty, f: a.f + fd.f * item.qty };
    }, { kcal: 0, p: 0, c: 0, f: 0 });
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => { setBuildingPlan(false); setPlanItems([]); setPlanName(""); }} style={{ background: "none", border: "none", color: T.accent, fontSize: 22, cursor: "pointer", padding: 0 }}>←</button>
          <span style={{ color: T.ink, fontWeight: 700, fontSize: 17 }}>Create Saved Meal</span>
        </div>
        <Card>
          <input placeholder="Meal name (e.g. My Breakfast)" value={planName} onChange={(e) => setPlanName(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 8 }} />
          <select value={planMealType} onChange={(e) => setPlanMealType(e.target.value)} style={selectStyle}>
            {["Breakfast","Lunch","Dinner","Snack"].map((t) => <option key={t}>{t}</option>)}
          </select>
        </Card>

        {/* Added items */}
        {planItems.length > 0 && (
          <Card>
            <Label>Meal contents</Label>
            {planItems.map((item, i) => {
              const fd = foodDb.find((f) => f.name === item.foodName);
              return (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: i < planItems.length - 1 ? `1px solid ${T.border}` : "none" }}>
                  <div>
                    <div style={{ fontSize: 13, color: T.ink, fontWeight: 600 }}>{item.foodName}</div>
                    <div style={{ fontSize: 11, color: T.soft }}>{item.qty} × {fd?.unit} · {fd ? Math.round(fd.kcal * item.qty) : "?"} kcal</div>
                  </div>
                  <button onClick={() => setPlanItems(planItems.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: T.alert, fontSize: 18, cursor: "pointer" }}>×</button>
                </div>
              );
            })}
            <div style={{ marginTop: 10, padding: "8px 0", borderTop: `1px solid ${T.border}`, display: "flex", gap: 16 }}>
              <span style={{ fontSize: 12, color: T.soft }}>Total</span>
              <GradText style={{ fontSize: 14, fontWeight: 700, fontFamily: T.mono }}>{Math.round(planTotals.kcal)} kcal</GradText>
              <span style={{ fontSize: 12, color: T.soft }}>P {Math.round(planTotals.p)}g · C {Math.round(planTotals.c)}g · F {Math.round(planTotals.f)}g</span>
            </div>
          </Card>
        )}

        {/* Food picker */}
        <Card>
          <Label>Add food to this meal</Label>
          <input placeholder="Search foods…" value={planSearch} onChange={(e) => setPlanSearch(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 6 }} />
          <div style={{ maxHeight: 160, overflowY: "auto", border: `1px solid ${T.border}`, borderRadius: 10, marginBottom: 8 }}>
            {planFiltered.map((f) => (
              <button key={f.name} onClick={() => {
                setPlanItems([...planItems, { foodName: f.name, qty: planPickQty }]);
                showToast(`+ ${f.name.slice(0,25)}`);
              }} style={{ display: "block", width: "100%", textAlign: "left", padding: "9px 12px", background: "transparent", border: "none", borderBottom: `1px solid ${T.border}`, cursor: "pointer", fontFamily: T.sans }}>
                <span style={{ fontSize: 13, color: T.ink }}>{f.name}</span>
                <span style={{ fontSize: 11, color: T.soft }}> · {f.unit} · </span>
                <span style={{ fontSize: 12, color: T.accent, fontWeight: 700 }}>{f.kcal} kcal</span>
              </button>
            ))}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
            <span style={{ fontSize: 12, color: T.soft }}>Qty:</span>
            <input type="number" min="0.5" step="0.5" value={planPickQty} onChange={(e) => setPlanPickQty(parseFloat(e.target.value) || 1)} style={{ ...inputStyle, width: 65 }} />
            <span style={{ fontSize: 12, color: T.soft }}>(tap a food above to add it)</span>
          </div>
        </Card>

        <button
          style={{ ...btnStyle, width: "100%", padding: 14, fontSize: 15, opacity: (!planName.trim() || planItems.length === 0) ? 0.4 : 1 }}
          disabled={!planName.trim() || planItems.length === 0}
          onClick={() => {
            saveMealPlan({ name: planName.trim(), mealType: planMealType, items: planItems });
            showToast(`✓ "${planName.trim()}" saved!`);
            setBuildingPlan(false); setPlanItems([]); setPlanName(""); setPlanSearch("");
          }}
        >💾 Save Meal</button>
      </div>
    );
  }

  // ── Main food view ─────────────────────────────────────────────────────
  const mealsByType = {};
  MEAL_TABS.slice(1).forEach((t) => { mealsByType[t] = meals.filter((m) => m.meal === t); });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {/* Toast */}
      {toast && (
        <div style={{ position: "fixed", top: 70, left: "50%", transform: "translateX(-50%)", zIndex: 999, background: "rgba(0,212,160,0.92)", color: "#0B0B18", padding: "10px 20px", borderRadius: 99, fontSize: 13, fontWeight: 700, whiteSpace: "nowrap", boxShadow: "0 4px 20px rgba(0,212,160,0.4)" }}>
          {toast}
        </div>
      )}

      {/* Calorie ring + budget */}
      <Card glow={pct >= 95}>
        <Label>Calorie Budget — {dateLabel}</Label>
        <div style={{ display: "flex", alignItems: "center", gap: 18, marginTop: 8 }}>
          <div style={{ position: "relative", flexShrink: 0 }}>
            <RadialProgress pct={pct} size={110} stroke={12} />
            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <Num size={26}>{pct}</Num>
              <span style={{ fontSize: 11, color: T.soft }}>%</span>
            </div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ marginBottom: 6 }}>
              <div style={{ fontSize: 11, color: T.soft }}>Consumed</div>
              <GradText style={{ fontSize: 28, fontWeight: 800, fontFamily: T.mono }}>{Math.round(totals.kcal)}</GradText>
              <span style={{ fontSize: 14, color: T.soft }}> kcal</span>
            </div>
            <div style={{ display: "flex", gap: 16 }}>
              <div>
                <div style={{ fontSize: 11, color: T.soft }}>Budget</div>
                <Num size={16}>{plan.target}</Num>
              </div>
              <div>
                <div style={{ fontSize: 11, color: remaining >= 0 ? T.good : T.alert }}>{remaining >= 0 ? "Remaining" : "Over"}</div>
                <Num size={16} color={remaining >= 0 ? T.good : T.alert}>{Math.abs(Math.round(remaining))}</Num>
              </div>
            </div>
          </div>
        </div>
      </Card>

      {/* Saved Meals */}
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: mealPlans.length > 0 ? 12 : 0 }}>
          <Label>Saved Meals</Label>
          <div style={{ display: "flex", gap: 8 }}>
            {mealPlans.length > 0 && (
              <button onClick={() => setShowSavedMeals(!showSavedMeals)} style={{ background: "none", border: "none", color: T.soft, fontSize: 12, cursor: "pointer", fontFamily: T.sans }}>
                {showSavedMeals ? "▲ Hide" : "▼ Show all"}
              </button>
            )}
            <button onClick={() => setBuildingPlan(true)} style={{ background: T.gradAccent, border: "none", color: "#fff", fontSize: 12, padding: "5px 12px", borderRadius: 99, cursor: "pointer", fontWeight: 700 }}>+ New</button>
          </div>
        </div>
        {mealPlans.length === 0 ? (
          <div style={{ color: T.soft, fontSize: 13 }}>No saved meals yet — hit <strong style={{ color: T.ink }}>+ New</strong> to create one. Log your usual breakfast/lunch in one tap.</div>
        ) : (
          (showSavedMeals ? mealPlans : mealPlans.slice(-3)).map((mp, idx) => {
            const mpTotals = mp.items.reduce((a, item) => {
              const fd = foodDb.find((f) => f.name === item.foodName);
              if (!fd) return a;
              return { kcal: a.kcal + fd.kcal * item.qty, p: a.p + fd.p * item.qty };
            }, { kcal: 0, p: 0 });
            return (
              <div key={idx} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderTop: `1px solid ${T.border}` }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, color: T.ink, fontWeight: 700 }}>{mp.name}</div>
                  <div style={{ fontSize: 11, color: T.soft, marginTop: 2 }}>
                    {mp.mealType} · {mp.items.length} items · <span style={{ color: T.accent, fontWeight: 700 }}>{Math.round(mpTotals.kcal)} kcal</span> · P {Math.round(mpTotals.p)}g
                  </div>
                  <div style={{ fontSize: 11, color: T.soft, marginTop: 1 }}>{mp.items.map((it) => `${it.qty}× ${it.foodName.split(" ").slice(0,2).join(" ")}`).join(", ")}</div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0, marginLeft: 8 }}>
                  <button onClick={() => {
                    mp.items.forEach((item) => {
                      const fd = foodDb.find((f) => f.name === item.foodName);
                      if (!fd) return;
                      addFood({ meal: mp.mealType, name: fd.name, kcal: fd.kcal * item.qty, p: fd.p * item.qty, c: fd.c * item.qty, f: fd.f * item.qty, fiber: (fd.fiber || 0) * item.qty, iron: (fd.iron || 0) * item.qty, calcium: (fd.calcium || 0) * item.qty, sodium: (fd.sodium || 0) * item.qty, potassium: (fd.potassium || 0) * item.qty });
                    });
                    showToast(`✓ Logged "${mp.name}"`);
                  }} style={{ background: T.gradAccent, border: "none", color: "#fff", fontSize: 12, padding: "6px 12px", borderRadius: 8, cursor: "pointer", fontWeight: 700 }}>Log</button>
                  <button onClick={() => { if (window.confirm(`Delete "${mp.name}"?`)) deleteMealPlan(mealPlans.indexOf(mp)); }} style={{ background: "rgba(255,75,110,0.12)", border: "none", color: T.alert, fontSize: 12, padding: "6px 10px", borderRadius: 8, cursor: "pointer" }}>✕</button>
                </div>
              </div>
            );
          })
        )}
      </Card>

      {/* Macro breakdown */}
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <Label>Macronutrients</Label>
          <button onClick={() => setInsightView("contributors")} style={{ background: "none", border: "none", color: T.accent, fontSize: 12, cursor: "pointer", fontFamily: T.sans, fontWeight: 600 }}>View Contributors →</button>
        </div>
        {macroConfig.map((m) => {
          const val = totals[m.key] || 0;
          const target = m.t || macroTargets[m.key] || 1;
          const p = Math.min(100, (val / target) * 100);
          return (
            <div key={m.key} style={{ marginBottom: 12 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <div style={{ width: 10, height: 10, borderRadius: 99, background: m.grad, flexShrink: 0 }} />
                  <span style={{ fontSize: 14, color: T.ink }}>{m.label}</span>
                </div>
                <span style={{ fontSize: 13, color: T.soft }}><span style={{ color: m.color, fontWeight: 700 }}>{Math.round(val)}</span>g / {target}g · {Math.round(p)}%</span>
              </div>
              <MacroBar value={val} target={target} grad={m.grad} />
            </div>
          );
        })}
        {/* Micronutrients inline */}
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${T.border}` }}>
          <div style={{ fontSize: 12, color: T.soft, fontWeight: 600, marginBottom: 10, letterSpacing: 0.5 }}>MICRONUTRIENTS</div>
          {[
            { key: "fiber",     label: "Fiber",     t: pt.fiber,     unit: "g",  grad: "linear-gradient(90deg,#B14FFF,#7B2FFF)", isCap: false },
            { key: "iron",      label: "Iron",      t: pt.iron,      unit: "mg", grad: "linear-gradient(90deg,#FF6B35,#FFD700)", isCap: false },
            { key: "calcium",   label: "Calcium",   t: pt.calcium,   unit: "mg", grad: "linear-gradient(90deg,#00D4A0,#00BFFF)", isCap: false },
            { key: "sodium",    label: "Sodium",    t: pt.sodium,    unit: "mg", grad: "linear-gradient(90deg,#FF4B6E,#FF6B35)", isCap: true  },
            { key: "potassium", label: "Potassium", t: pt.potassium, unit: "mg", grad: "linear-gradient(90deg,#00BFFF,#B14FFF)", isCap: false },
          ].map((m) => {
            const val = totals[m.key] || 0;
            const pct = Math.min(100, (val / m.t) * 100);
            const over = m.isCap && val > m.t;
            return (
              <div key={m.key} style={{ marginBottom: 9 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                  <span style={{ fontSize: 12, color: T.soft }}>{m.label}{m.isCap ? " ⚠ cap" : ""}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: over ? T.alert : T.soft }}>
                    {val % 1 === 0 ? val : val.toFixed(1)}{m.unit} / {m.t}{m.unit}
                  </span>
                </div>
                <MacroBar value={val} target={m.t} grad={over ? "linear-gradient(90deg,#FF4B6E,#FF6B35)" : m.grad} />
              </div>
            );
          })}
        </div>
      </Card>

      {/* Per-meal log */}
      <Card>
        <Label>Today's Meals</Label>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8, marginBottom: 8 }}>
          {MEAL_TABS.map((t) => (
            <button key={t} onClick={() => setMealFilter(t)} style={{ flexShrink: 0, padding: "5px 12px", borderRadius: 99, border: "none", background: mealFilter === t ? T.gradAccent : "rgba(255,255,255,0.07)", color: mealFilter === t ? "#fff" : T.soft, fontSize: 12, cursor: "pointer", fontWeight: mealFilter === t ? 700 : 400 }}>{t}</button>
          ))}
        </div>
        {viewMeals.length === 0 ? (

        <button onClick={() => setShowCustomFood(!showCustomFood)} style={{ display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", color: T.accent2, fontSize: 12, cursor: "pointer", padding: "0 0 10px", fontFamily: T.sans, fontWeight: 600 }}>

/* ---------- Awards tab ---------- */
function AwardsTab({ workoutLog, meals, profile, plan, exerciseDb, dateLabel }) {
  const volumeByGroup = useMemo(() => {
    const m = {};
    workoutLog.forEach((ex) => {
      const g = groupFor(ex.name, exerciseDb);
      const v = ex.sets.reduce((s, st) => s + st.weight * st.reps, 0);
      m[g] = (m[g] || 0) + v;
    });
    return Object.entries(m).map(([group, volume]) => ({ group, volume: Math.round(volume) }));
  }, [workoutLog, exerciseDb]);

  const totals = meals.reduce((a, m) => ({ kcal: a.kcal + m.kcal, p: a.p + m.p }), { kcal: 0, p: 0 });
  const setVolume = workoutLog.reduce((sum, ex) => sum + ex.sets.reduce((s, st) => s + st.weight * st.reps, 0), 0);
  const totalSets = workoutLog.reduce((s, ex) => s + ex.sets.length, 0);
  const macroTargets = { p: personalizedTargets(profile, plan.target).protein };

  const calorieOnTarget = totals.kcal > 0 && totals.kcal <= plan.target;
  const proteinOnTarget = totals.p >= macroTargets.p * 0.8;
  const workoutLogged = workoutLog.length > 0;
  const badges = [
    { label: "Calories on target", earned: calorieOnTarget, icon: "🎯" },
    { label: "Protein goal", earned: proteinOnTarget, icon: "💪" },
    { label: "Workout logged", earned: workoutLogged, icon: "🏋️" },
    { label: "Balanced day", earned: calorieOnTarget && proteinOnTarget && workoutLogged, icon: "🏆" },
  ];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Card style={{ background: T.goldSoft, border: `1px solid ${T.gold}33` }}>
        <Label>{dateLabel}'s badges</Label>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {badges.map((b) => (
            <div key={b.label} style={{ display: "flex", alignItems: "center", gap: 8, opacity: b.earned ? 1 : 0.35 }}>
              <span style={{ fontSize: 20 }}>{b.icon}</span>
              <span style={{ fontSize: 12, color: T.ink }}>{b.label}</span>
            </div>
          ))}
        </div>
      </Card>

      <Card>
        <Label>Food vs workout — {dateLabel}</Label>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, fontSize: 13 }}>
          <div>Calories eaten <Num size={14}>{totals.kcal}</Num></div>
          <div>Calorie target <Num size={14}>{plan.target}</Num></div>
          <div>Protein eaten <Num size={14}>{Math.round(totals.p)}g</Num></div>
          <div>Sets trained <Num size={14}>{totalSets}</Num></div>
          <div>Training volume <Num size={14}>{Math.round(setVolume)}kg</Num></div>
          <div>Net status <Num size={14} color={calorieOnTarget ? T.good : T.alert}>{calorieOnTarget ? "On track" : "Over"}</Num></div>
        </div>
      </Card>

      <Card style={{ background: T.goodSoft, border: `1px solid ${T.good}22` }}>
        <Label>End-of-day review (auto)</Label>
        <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13, color: T.ink, lineHeight: 1.6 }}>
          {!proteinOnTarget && <li>Protein is running low — add a curd, egg, or dal serving.</li>}
          {totals.kcal > plan.target && <li>Over calorie target today — keep dinner lighter or extend tomorrow's workout.</li>}
          {!workoutLogged && <li>No workout logged — even a short session keeps the weekly volume on track.</li>}
          {calorieOnTarget && proteinOnTarget && workoutLogged && <li>Solid day — calories, protein, and training all on target. Keep this pattern going tomorrow.</li>}
        </ul>
      </Card>

      <Card>
        <Label>Weight trend (kg)</Label>
        <WeightTrendChart data={WEIGHT_HISTORY} />
      </Card>

      <Card>
        {(() => {
          const wt = Number(profile.weight) || 0;
          const ht = Number(profile.height) || 0;
          const age = Number(profile.age) || 0;
          const sex = profile.sex || "male";
          const bmi = ht > 0 ? wt / ((ht / 100) ** 2) : 0;
          // Deurenberg 1991 body fat estimate
          const estBF = bmi > 0 ? Math.max(0, +(1.20 * bmi + 0.23 * age - (sex === "male" ? 16.2 : 5.4)).toFixed(1)) : null;
          const estMM = estBF && wt ? +((wt * (1 - estBF / 100)) * (sex === "male" ? 0.47 : 0.44)).toFixed(1) : null;
          // Visceral fat: qualitative level from BMI + age (InBody 1–20 scale)
          const estVF = bmi > 0 ? (bmi >= 30 ? (age >= 50 ? 16 : 13) : bmi >= 25 ? (age >= 50 ? 12 : 9) : bmi >= 23 ? (age >= 50 ? 8 : 6) : 4) : null;

          const bf   = profile.bodyFat   || (estBF  ? `~${estBF}`  : "—");
          const mm   = profile.muscleMass || (estMM  ? `~${estMM}`  : "—");
          const vf   = profile.visceralFat || (estVF  ? `~${estVF}`  : "—");
          const isEst = !profile.bodyFat && estBF;
          return (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <Label>Body composition</Label>
                {isEst && <span style={{ fontSize: 10, color: T.accent2, background: "rgba(177,79,255,0.12)", padding: "2px 8px", borderRadius: 99 }}>~ Estimated</span>}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, fontSize: 13 }}>
                <div>Weight <Num size={14}>{wt || "—"} kg</Num></div>
                <div>Body fat <Num size={14}>{bf}{typeof bf === "number" || (typeof bf === "string" && !bf.startsWith("~") && bf !== "—") ? "%" : (bf.startsWith("~") ? "%" : "")}</Num></div>
                <div>Muscle mass <Num size={14}>{mm}{mm !== "—" ? " kg" : ""}</Num></div>
                <div>Visceral fat <Num size={14}>{vf}</Num></div>
                <div>Goal weight <Num size={14}>{profile.goalWeight || "—"} kg</Num></div>
                <div>To lose <Num size={14}>{wt && profile.goalWeight ? `${(wt - profile.goalWeight).toFixed(1)} kg` : "—"}</Num></div>
              </div>
              {isEst && <div style={{ fontSize: 11, color: T.soft, marginTop: 8 }}>~ values estimated from height/weight/age. Enter InBody results in Profile to see actuals.</div>}
            </>
          );
        })()}
      </Card>

      <Card>
        <Label>Training volume by muscle group (kg lifted)</Label>
        {volumeByGroup.length === 0 ? <div style={{ fontSize: 13, color: T.soft }}>Log a few workouts to see the balance across muscle groups.</div> : <VolumeBarChart data={volumeByGroup} />}
      </Card>
    </div>
  );
}

/* ---------- Profile tab ---------- */
function ProfileTab({ profile, setProfile, plan, onReset }) {
  const [heightUnit, setHeightUnit] = React.useState("cm");
  const upd = (k, v) => setProfile({ ...profile, [k]: v });
  const numField = (k, label, unit, w = 90) => (
    <div style={{ marginBottom: 10 }}>
      <Label>{label}</Label>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <input type="number" value={profile[k]} onChange={(e) => { const v = e.target.value; upd(k, v === "" ? "" : parseFloat(v)); }} style={{ ...inputStyle, width: w }} />
        <span style={{ fontSize: 12, color: T.soft }}>{unit}</span>
      </div>
    </div>
  );

  const DISEASES = [
    { id: "diabetes",       label: "Diabetes (Type 2)" },
    { id: "hypertension",   label: "Hypertension" },
    { id: "pcos",           label: "PCOS" },
    { id: "hypothyroid",    label: "Hypothyroid" },
    { id: "cholesterol",    label: "High Cholesterol" },
    { id: "kidney",         label: "Kidney Disease" },
  ];
  const diseases = profile.diseases || [];
  const toggleDisease = (id) => {
    const next = diseases.includes(id) ? diseases.filter((d) => d !== id) : [...diseases, id];
    upd("diseases", next);
  };

  // ft+in ↔ cm helpers
  const cmToFtIn = (cm) => { const totalIn = cm / 2.54; const ft = Math.floor(totalIn / 12); return { ft, inches: Math.round(totalIn % 12) }; };
  const { ft: dispFt, inches: dispIn } = cmToFtIn(Number(profile.height) || 0);

  const pct = Math.round((plan.target / plan.tdee) * 100);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <Card>
        <Label>Your stats</Label>

        {/* Sex */}
        <div style={{ marginBottom: 10 }}>
          <Label>Sex</Label>
          <div style={{ display: "flex", gap: 8 }}>
            {["male", "female"].map((s) => (
              <button key={s} onClick={() => upd("sex", s)} style={{ flex: 1, padding: "8px", borderRadius: 8, border: "none", background: profile.sex === s ? T.gradAccent : "rgba(255,255,255,0.07)", color: profile.sex === s ? "#fff" : T.soft, fontSize: 13, cursor: "pointer", fontWeight: 700, textTransform: "capitalize" }}>{s}</button>
            ))}
          </div>
        </div>

        {numField("weight", "Current weight", "kg")}

        {/* Height with cm / ft toggle */}
        <div style={{ marginBottom: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <Label style={{ marginBottom: 0 }}>Height</Label>
            <div style={{ display: "flex", gap: 4 }}>
              {["cm", "ft"].map((u) => (
                <button key={u} onClick={() => setHeightUnit(u)} style={{ padding: "3px 10px", borderRadius: 6, border: "none", background: heightUnit === u ? T.gradAccent : "rgba(255,255,255,0.07)", color: heightUnit === u ? "#fff" : T.soft, fontSize: 11, cursor: "pointer", fontWeight: 700 }}>{u}</button>
              ))}
            </div>
          </div>
          {heightUnit === "cm" ? (
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <input type="number" value={profile.height} onChange={(e) => { const v = e.target.value; upd("height", v === "" ? "" : parseFloat(v)); }} style={{ ...inputStyle, width: 90 }} />
              <span style={{ fontSize: 12, color: T.soft }}>cm</span>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input type="number" min="1" max="8" value={dispFt || ""} onChange={(e) => { const f = parseFloat(e.target.value) || 0; upd("height", Math.round((f * 12 + dispIn) * 2.54)); }} style={{ ...inputStyle, width: 60 }} placeholder="5" />
              <span style={{ fontSize: 12, color: T.soft }}>ft</span>
              <input type="number" min="0" max="11" value={dispIn || ""} onChange={(e) => { const i = parseFloat(e.target.value) || 0; upd("height", Math.round((dispFt * 12 + i) * 2.54)); }} style={{ ...inputStyle, width: 60 }} placeholder="11" />
              <span style={{ fontSize: 12, color: T.soft }}>in</span>
              {profile.height ? <span style={{ fontSize: 11, color: T.soft }}>= {profile.height} cm</span> : null}
            </div>
          )}
        </div>

        {numField("age", "Age", "years")}
        {numField("goalWeight", "Goal weight", "kg")}

        <Label>Activity level</Label>
        <select value={profile.activity} onChange={(e) => upd("activity", e.target.value)} style={selectStyle}>
          <option value="sedentary">Sedentary — little to no exercise</option>
          <option value="light">Light — 1–3 workouts/week</option>
          <option value="moderate">Moderate — 4–5 workouts/week</option>
          <option value="active">Active — daily training</option>
        </select>

        {/* Existing conditions */}
        <div style={{ marginTop: 12 }}>
          <Label>Existing conditions (optional)</Label>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
            {DISEASES.map(({ id, label }) => (
              <button key={id} onClick={() => toggleDisease(id)} style={{ padding: "6px 11px", borderRadius: 99, border: `1px solid ${diseases.includes(id) ? T.accent2 : T.border}`, background: diseases.includes(id) ? "rgba(177,79,255,0.15)" : "transparent", color: diseases.includes(id) ? T.accent2 : T.soft, fontSize: 12, cursor: "pointer", fontWeight: diseases.includes(id) ? 700 : 400 }}>
                {diseases.includes(id) ? "✓ " : ""}{label}
              </button>
            ))}
          </div>
          {diseases.includes("hypertension") && <div style={{ fontSize: 11, color: T.accent2, marginTop: 6 }}>↳ Sodium target reduced to 1500 mg (hypertension guideline)</div>}
          {diseases.includes("diabetes") && <div style={{ fontSize: 11, color: T.accent2, marginTop: 4 }}>↳ Carb target lowered to 25% of calories</div>}
          {diseases.includes("kidney") && <div style={{ fontSize: 11, color: T.accent2, marginTop: 4 }}>↳ Protein target reduced to 0.8 g/kg; potassium lowered</div>}
        </div>

        {/* InBody / Body composition */}
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${T.border}` }}>
          <Label>Body composition (optional — from InBody or scale)</Label>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            {[["bodyFat", "Body fat", "%"], ["muscleMass", "Muscle mass", "kg"], ["visceralFat", "Visceral fat", "level"]].map(([k, label, unit]) => (
              <div key={k}>
                <div style={{ fontSize: 11, color: T.soft, marginBottom: 4 }}>{label}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                  <input type="number" value={profile[k] || ""} onChange={(e) => { const v = e.target.value; upd(k, v === "" ? "" : parseFloat(v)); }} style={{ ...inputStyle, width: "100%" }} placeholder="—" />
                  <span style={{ fontSize: 11, color: T.soft, whiteSpace: "nowrap" }}>{unit}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </Card>

      <Card>
        <Label>Your plan (calculated)</Label>
        <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
          <div style={{ width: 108, height: 108, position: "relative", flexShrink: 0 }}>
            <RadialProgress pct={pct} />
            <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
              <Num size={20} color={T.accent}>{plan.target}</Num>
              <span style={{ fontSize: 10, color: T.soft }}>kcal/day</span>
            </div>
          </div>
          <div style={{ fontSize: 12, color: T.soft, lineHeight: 1.5 }}>
            <span style={{ color: T.ink }}>{pct}%</span> of your {plan.tdee} kcal maintenance level — a {plan.tdee - plan.target} kcal daily deficit, safely capped.
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
          <div style={{ background: T.goodSoft, borderRadius: 8, padding: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
              <span style={{ fontSize: 13 }}>📉</span>
              <span style={{ fontSize: 11, color: T.soft }}>Weekly loss</span>
            </div>
            <Num size={16} color={T.good}>{plan.weeklyLossKg.toFixed(2)} kg</Num>
          </div>
          <div style={{ background: "rgba(255,107,53,0.10)", borderRadius: 10, padding: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 4 }}>
              <span style={{ fontSize: 13 }}>🗓️</span>
              <span style={{ fontSize: 11, color: T.soft }}>Time to goal</span>
            </div>
            <Num size={16} color={T.accent}>{plan.weeks ? `${plan.weeks} wks` : "—"}</Num>
          </div>
        </div>
        <div style={{ fontSize: 11, color: T.soft, marginTop: 10, display: "flex", gap: 5 }}>
          <span style={{ flexShrink: 0 }}>🔥</span>
          Capped near a safe 0.5–1% of bodyweight per week — the target never drops below a healthy floor.
        </div>
      </Card>

      <button onClick={onReset} style={{ background: "none", border: "none", color: T.alert, fontSize: 12, cursor: "pointer", padding: "4px 0", textAlign: "left" }}>
        Reset all saved data
      </button>
    </div>
  );
}

function formatDateLabel(iso, todayISO) {
  if (iso === todayISO) return "Today";
  const yest = new Date(todayISO + "T00:00:00"); yest.setDate(yest.getDate() - 1);
  if (iso === yest.toISOString().slice(0, 10)) return "Yesterday";
  return new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

/* ---------- App shell ---------- */
function App() {
  const saved = loadSaved();
  const todayISO = new Date().toISOString().slice(0, 10);

  const DEFAULT_PROFILE = { weight: "", height: "", age: "", sex: "male", goalWeight: "", activity: "moderate", diseases: [], bodyFat: "", muscleMass: "", visceralFat: "" };
  const [profile, setProfile] = useState(saved?.profile ? { ...DEFAULT_PROFILE, ...saved.profile } : DEFAULT_PROFILE);
  const [meals, setMeals] = useState(saved?.meals || []);
  const [workoutLog, setWorkoutLog] = useState(
    saved?.workoutLog || []
  );
  const [exerciseDb, setExerciseDb] = useState(saved?.exerciseDb || SEED_EXERCISES);
  const [foodDb, setFoodDb] = useState(saved?.foodDb || SEED_FOODS);
  const [mealPlans, setMealPlans] = useState(saved?.mealPlans || []);
  const [tab, setTab] = useState("Profile");
  const [viewDate, setViewDate] = useState(todayISO);

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ profile, meals, workoutLog, exerciseDb, foodDb, mealPlans })); }
    catch (e) { /* storage unavailable — app still works, just won't persist */ }
  }, [profile, meals, workoutLog, exerciseDb, foodDb, mealPlans]);

  const plan = safeDeficitPlan(profile);
  const addFood = (m) => setMeals([...meals, { ...m, date: viewDate }]);
  const addWorkout = (exs) => setWorkoutLog([...workoutLog, ...exs.map((e) => ({ ...e, date: viewDate }))]);
  const removeWorkout = (i) => setWorkoutLog(workoutLog.filter((_, idx) => idx !== i));
  const addExercise = (e) => setExerciseDb([...exerciseDb, e]);
  const addFoodToDb = (f) => {
    if (foodDb.some((x) => x.name === f.name)) return; // already in list
    setFoodDb([...foodDb, f]);
  };
  const saveMealPlan = (plan) => setMealPlans([...mealPlans, plan]);
  const deleteMealPlan = (idx) => setMealPlans(mealPlans.filter((_, i) => i !== idx));
  const resetAll = () => {
    if (!window.confirm("This clears all logged meals, workouts, and your saved profile. Continue?")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    window.location.reload();
  };

  const viewMeals = meals.filter((m) => m.date === viewDate);
  const workoutWithIdx = workoutLog.map((w, i) => ({ ...w, _idx: i }));
  const viewWorkout = workoutWithIdx.filter((w) => w.date === viewDate);
  const dateLabel = formatDateLabel(viewDate, todayISO);

  const TABS = [
    { id: "Profile", icon: "👤" },
    { id: "Workout", icon: "🏋️" },
    { id: "Food",    icon: "🥗" },
    { id: "Awards",  icon: "🏆" },
  ];

  return (
    <div style={{ fontFamily: T.sans, background: T.bg, minHeight: "100vh", display: "flex", justifyContent: "center" }}>
      <div style={{ width: "100%", maxWidth: 420, minHeight: "100vh", display: "flex", flexDirection: "column" }}>

        {/* ── Header ── */}
        <div style={{ padding: "20px 16px 12px", background: "linear-gradient(180deg,rgba(177,79,255,0.12) 0%,transparent 100%)" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
            <GradText style={{ fontSize: 28, fontWeight: 900, letterSpacing: "-0.5px" }}>Thali</GradText>
            <span style={{ fontSize: 12, color: T.soft }}>nutrition &amp; training</span>
          </div>
          {(tab === "Workout" || tab === "Food" || tab === "Awards") && (
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 10 }}>
              <input
                type="date" value={viewDate} max={todayISO}
                onChange={(e) => setViewDate(e.target.value)}
                style={{ ...inputStyle, fontSize: 12, padding: "5px 10px" }}
              />
              <span style={{ fontSize: 12, color: T.soft }}>{dateLabel}</span>
              {viewDate !== todayISO && (
                <button onClick={() => setViewDate(todayISO)} style={{ background: "none", border: "none", color: T.accent, fontSize: 12, cursor: "pointer", padding: 0, fontWeight: 600, fontFamily: T.sans }}>
                  → Today
                </button>
              )}
            </div>
          )}
        </div>

        {/* ── Content ── */}
        <div style={{ flex: 1, padding: "0 14px 110px", overflowY: "auto" }}>
          {tab === "Profile" && <ProfileTab profile={profile} setProfile={setProfile} plan={plan} onReset={resetAll} />}
          {tab === "Workout" && <WorkoutTab workoutLog={viewWorkout} addWorkout={addWorkout} removeWorkout={removeWorkout} profile={profile} exerciseDb={exerciseDb} addExercise={addExercise} dateLabel={dateLabel} />}
          {tab === "Food" && <FoodTab meals={viewMeals} addFood={addFood} plan={plan} profile={profile} foodDb={foodDb} addFoodToDb={addFoodToDb} mealPlans={mealPlans} saveMealPlan={saveMealPlan} deleteMealPlan={deleteMealPlan} dateLabel={dateLabel} />}
          {tab === "Awards" && <AwardsTab workoutLog={viewWorkout} meals={viewMeals} profile={profile} plan={plan} exerciseDb={exerciseDb} dateLabel={dateLabel} />}
        </div>

        {/* ── Tab bar ── */}
        <div style={{
          position: "fixed", bottom: 0, width: "100%", maxWidth: 420,
          backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)",
          background: "rgba(11,11,24,0.88)",
          borderTop: "1px solid rgba(255,255,255,0.08)",
          display: "flex", justifyContent: "space-around",
          padding: "10px 0 calc(10px + env(safe-area-inset-bottom))",
        }}>
          {TABS.map(({ id, icon }) => {
            const active = tab === id;
            return (
              <button key={id} onClick={() => setTab(id)} style={{
                background: "none", border: "none", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
                padding: "4px 16px", minWidth: 64,
              }}>
                <span style={{ fontSize: 20 }}>{icon}</span>
                <span style={{
                  fontSize: 10, fontWeight: 700, letterSpacing: "0.04em",
                  color: active ? "transparent" : T.soft,
                  background: active ? T.gradAccent : "none",
                  WebkitBackgroundClip: active ? "text" : "unset",
                  WebkitTextFillColor: active ? "transparent" : T.soft,
                  backgroundClip: active ? "text" : "unset",
                }}>{id.toUpperCase()}</span>
                {active && <div style={{ width: 20, height: 3, borderRadius: 99, background: T.gradAccent, marginTop: 1 }} />}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
